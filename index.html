<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>四季大冒险 – ผจญภัยสี่ฤดู</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;800&family=Noto+Sans+Thai:wght@400;600&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf2ef;--card:#fff;--tx:#17302d;--mu:#587570;--ln:#cfdcd8;--sp:#4fa66a;--su:#e8920f;--au:#c4562f;--wi:#3f7fc4;--ok:#1f9d55;--no:#d1383c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101c1b;--card:#1a2b29;--tx:#e8f3f0;--mu:#93b0aa;--ln:#2e4743;--sp:#5cbb78;--su:#f0a030;--au:#e0693f;--wi:#5a98dc;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101c1b;--card:#1a2b29;--tx:#e8f3f0;--mu:#93b0aa;--ln:#2e4743;--sp:#5cbb78;--su:#f0a030;--au:#e0693f;--wi:#5a98dc;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai","Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
.zh{font-family:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
#app{max-width:720px;margin:0 auto;padding:14px 14px 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-weight:600}
.pill{background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:6px 14px;font-size:.95rem}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--wi);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:20px;text-align:center}
h1{font-size:clamp(2.6rem,11vw,4rem);margin:4px 0;line-height:1.1}
h2{margin:0 0 6px;font-size:1.15rem}
p{margin:6px 0;line-height:1.55}
.mu{color:var(--mu)}
.big{font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.3;margin:8px 0 2px}
.py{color:var(--tx);font-size:1.25rem;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.s{border:0;border-radius:18px;padding:16px 8px;color:#fff;font-size:1.7rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:96px;touch-action:manipulation}
.s small{font-family:inherit;font-size:.8rem;opacity:.92}
.s.sp{background:var(--sp)}.s.su{background:var(--su)}.s.au{background:var(--au)}.s.wi{background:var(--wi)}
.s:active{transform:scale(.97)}
.s.dim{opacity:.35}
.s.hit{outline:5px solid var(--ok);outline-offset:2px}
.btn{border:0;background:var(--tx);color:var(--bg);font:600 1.05rem inherit;font-family:inherit;padding:13px 26px;border-radius:999px;cursor:pointer;margin:8px 4px 0;touch-action:manipulation}
.btn.alt{background:transparent;color:var(--tx);border:2px solid var(--ln)}
.say{border:2px solid var(--ln);background:transparent;color:var(--tx);border-radius:999px;padding:6px 14px;font-size:1rem;cursor:pointer;margin-top:6px}
.tm{height:6px;background:var(--ln);border-radius:9px;overflow:hidden;margin:12px 0 0}
.tm i{display:block;height:100%;background:var(--su);width:100%;transform-origin:left;animation:t 20s linear forwards}
@keyframes t{to{transform:scaleX(0)}}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:560px){.cards{grid-template-columns:repeat(4,1fr)}}
.c{border:2px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:16px;padding:12px 6px;cursor:pointer;font-family:inherit;touch-action:manipulation}
.c .e{font-size:2rem;display:block}.c .z{font-size:1.35rem;display:block}.c .p{font-size:.95rem;font-weight:600;color:var(--tx);display:block}
.c.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card));pointer-events:none}
.c.bad{border-color:var(--no);animation:sh .35s;pointer-events:none;opacity:.5}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:16px;padding:12px 16px;margin-top:10px;cursor:pointer;font-family:inherit;touch-action:manipulation}
.opt .z{font-size:1.4rem;display:block}.opt .p{font-size:1rem;font-weight:600;color:var(--tx)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card))}
.opt.bad{border-color:var(--no);animation:sh .35s}
.bk{position:relative}
.ball{position:absolute;top:-70px;left:50%;font-size:2rem;opacity:0;margin-left:-16px}
.bk.go .ball{animation:dr .8s ease-in forwards}
@keyframes dr{0%{opacity:1;transform:translateY(-30px)}60%{opacity:1;transform:translateY(80px)}100%{opacity:0;transform:translateY(100px) scale(.5)}}
.fb{min-height:1.6em;font-weight:600;margin-top:10px}
.stars{font-size:2.4rem;letter-spacing:6px}
.hdr{display:flex;gap:6px;justify-content:center;margin:10px 0}
.hdr span{font-size:2rem}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
:focus-visible{outline:3px solid var(--wi);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var S={spring:{z:'春天',p:'chūntiān',t:'ใบไม้ผลิ',e:'🌸',k:'sp'},summer:{z:'夏天',p:'xiàtiān',t:'ฤดูร้อน',e:'☀️',k:'su'},autumn:{z:'秋天',p:'qiūtiān',t:'ใบไม้ร่วง',e:'🍂',k:'au'},winter:{z:'冬天',p:'dōngtiān',t:'ฤดูหนาว',e:'❄️',k:'wi'}};
var KEYS=['spring','summer','autumn','winter'];
var P1=[
{z:'很热，我想喝水。',p:'Hěn rè, wǒ xiǎng hē shuǐ.',t:'ร้อนมาก อยากดื่มน้ำ',s:'summer'},
{z:'下雪了，很冷。',p:'Xià xuě le, hěn lěng.',t:'หิมะตกแล้ว หนาวมาก',s:'winter'},
{z:'花开了，天气很好。',p:'Huā kāi le, tiānqì hěn hǎo.',t:'ดอกไม้บานแล้ว อากาศดี',s:'spring'},
{z:'很凉快，叶子黄了。',p:'Hěn liángkuai, yèzi huáng le.',t:'เย็นสบาย ใบไม้เหลืองแล้ว',s:'autumn'},
{z:'我想吃冰淇淋。',p:'Wǒ xiǎng chī bīngqílín.',t:'ฉันอยากกินไอศกรีม',s:'summer'},
{z:'我穿很多衣服。',p:'Wǒ chuān hěn duō yīfu.',t:'ฉันใส่เสื้อผ้าหนาๆ',s:'winter'},
{z:'我们去公园看花。',p:'Wǒmen qù gōngyuán kàn huā.',t:'พวกเราไปดูดอกไม้ที่สวน',s:'spring'},
{z:'天气凉快，我喜欢看书。',p:'Tiānqì liángkuai, wǒ xǐhuan kàn shū.',t:'อากาศเย็น ฉันชอบอ่านหนังสือ',s:'autumn'},
{z:'我们去游泳吧！',p:'Wǒmen qù yóuyǒng ba!',t:'พวกเราไปว่ายน้ำกัน',s:'summer'},
{z:'今天下雪。',p:'Jīntiān xià xuě.',t:'วันนี้หิมะตก',s:'winter'}];
var P2=[
{z:'花开了',p:'huā kāi le',e:'🌸',s:'spring'},{z:'去公园',p:'qù gōngyuán',e:'🌳',s:'spring'},{z:'天气好',p:'tiānqì hǎo',e:'🌤️',s:'spring'},{z:'很暖和',p:'hěn nuǎnhuo',e:'🧺',s:'spring'},
{z:'很热',p:'hěn rè',e:'🥵',s:'summer'},{z:'游泳',p:'yóuyǒng',e:'🏊',s:'summer'},{z:'吃冰淇淋',p:'chī bīngqílín',e:'🍦',s:'summer'},{z:'喝水',p:'hē shuǐ',e:'🥤',s:'summer'},
{z:'很凉快',p:'hěn liángkuai',e:'🍃',s:'autumn'},{z:'刮风',p:'guā fēng',e:'💨',s:'autumn'},{z:'看书',p:'kàn shū',e:'📖',s:'autumn'},{z:'叶子黄了',p:'yèzi huáng le',e:'🍂',s:'autumn'},
{z:'很冷',p:'hěn lěng',e:'🥶',s:'winter'},{z:'下雪',p:'xià xuě',e:'❄️',s:'winter'},{z:'穿衣服',p:'chuān yīfu',e:'🧥',s:'winter'},{z:'喝热水',p:'hē rè shuǐ',e:'☕',s:'winter'}];
var P3=[
{q:'夏天你喜欢做什么？',qp:'Xiàtiān nǐ xǐhuan zuò shénme?',qt:'ฤดูร้อนคุณชอบทำอะไร',s:'summer',a:['夏天我喜欢游泳。','Xiàtiān wǒ xǐhuan yóuyǒng.'],w:[['夏天我喜欢下雪。','Xiàtiān wǒ xǐhuan xià xuě.'],['夏天我很冷。','Xiàtiān wǒ hěn lěng.']]},
{q:'冬天天气怎么样？',qp:'Dōngtiān tiānqì zěnmeyàng?',qt:'ฤดูหนาวอากาศเป็นอย่างไร',s:'winter',a:['冬天很冷。','Dōngtiān hěn lěng.'],w:[['冬天很热。','Dōngtiān hěn rè.'],['冬天我去游泳。','Dōngtiān wǒ qù yóuyǒng.']]},
{q:'春天你去哪儿？',qp:'Chūntiān nǐ qù nǎr?',qt:'ฤดูใบไม้ผลิคุณไปที่ไหน',s:'spring',a:['春天我去公园。','Chūntiān wǒ qù gōngyuán.'],w:[['春天下雪了。','Chūntiān xià xuě le.'],['春天我吃冰淇淋。','Chūntiān wǒ chī bīngqílín.']]},
{q:'秋天你喜欢做什么？',qp:'Qiūtiān nǐ xǐhuan zuò shénme?',qt:'ฤดูใบไม้ร่วงคุณชอบทำอะไร',s:'autumn',a:['秋天我喜欢看书。','Qiūtiān wǒ xǐhuan kàn shū.'],w:[['秋天我喜欢吃冰淇淋。','Qiūtiān wǒ xǐhuan chī bīngqílín.'],['秋天很热。','Qiūtiān hěn rè.']]},
{q:'今天下雪，现在是什么季节？',qp:'Jīntiān xià xuě, xiànzài shì shénme jìjié?',qt:'วันนี้หิมะตก ตอนนี้ฤดูอะไร',s:'winter',a:['现在是冬天。','Xiànzài shì dōngtiān.'],w:[['现在是夏天。','Xiànzài shì xiàtiān.'],['现在是秋天。','Xiànzài shì qiūtiān.']]}];
var $=document.getElementById('app'),sc=0,lv=0,qi=0,items=[],tmr=0,t0=0,sound=true;
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function say(t){if(!sound||!window.speechSynthesis)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function hd(n,max){return '<div class="top"><span class="pill">ด่าน '+lv+'/3</span><span class="pill">⭐ '+sc+'</span><button class="say" style="margin:0" onclick="sound=!sound;this.textContent=sound?\'🔊\':\'🔇\'">'+(sound?'🔊':'🔇')+'</button></div><div class="bar"><i style="width:'+Math.round(n/max*100)+'%"></i></div>'}
function seasonBtns(fn){return '<div class="grid">'+KEYS.map(function(k){var s=S[k];return '<button class="s '+s.k+'" data-k="'+k+'" onclick="'+fn+'(\''+k+'\')"><span>'+s.e+'</span><span class="zh">'+s.z+'</span><small>'+s.p+'</small></button>'}).join('')+'</div>'}

function home(){sc=0;lv=0;clearTimeout(tmr);
$.innerHTML='<div class="card"><div class="hdr"><span>🌸</span><span>☀️</span><span>🍂</span><span>❄️</span></div><h1 class="zh">四季大冒险</h1><p class="py">Sìjì dà màoxiǎn</p><h2>ผจญภัยสี่ฤดู</h2><p class="mu">3 ด่าน ฟัง–แตะ–พูดตาม<br>เหมาะกับนักเรียน YCT 1 เล่นเดี่ยวหรือฉายขึ้นจอแล้วแข่งเป็นทีม</p><p class="mu" style="font-size:.9rem">💡 เปิดเสียงเพื่อฟังประโยคภาษาจีน อ่านพินอินออกเสียงทุกครั้งก่อนตอบ</p><button class="btn" onclick="L1()">เริ่มเกม</button></div>'}

function L1(){sc=0;lv=1;qi=0;items=sh(P1).slice(0,8);q1()}
function q1(){if(qi>=items.length)return L2();var it=items[qi];
$.innerHTML=hd(qi,8)+'<div class="card"><h2>อ่านพินอินแล้วเลือกฤดูให้ตรง</h2><p class="mu">抢卡片 · มีเวลา 20 วินาที ตอบภายใน 10 วินาทีได้ 2 คะแนน</p><div class="big zh">'+it.z+'</div><div class="py">'+it.p+'</div><button class="say" onclick="say(\''+it.z+'\')">🔊 ฟังอีกครั้ง</button><div class="tm"><i></i></div>'+seasonBtns('a1')+'<div class="fb" id="fb"></div></div>';
say(it.z);t0=Date.now();clearTimeout(tmr);tmr=setTimeout(function(){a1(null)},20000)}
function a1(k){clearTimeout(tmr);var it=items[qi],ok=k===it.s,bs=$.querySelectorAll('.s');
bs.forEach(function(b){b.disabled=true;if(b.dataset.k===it.s)b.classList.add('hit');else b.classList.add('dim')});
var tm=$.querySelector('.tm i');if(tm)tm.style.animationPlayState='paused';
var fb=document.getElementById('fb');
if(ok){var g=(Date.now()-t0<10000)?2:1;sc+=g;fb.style.color='var(--ok)';fb.textContent='ถูก! +'+g+' 👏 พูดตาม: '+S[it.s].z+'！'}
else{fb.style.color='var(--no)';fb.textContent=(k?'ยังไม่ใช่ ':'หมดเวลา ')+'คำตอบคือ '+S[it.s].z}
if(ok)say(S[it.s].z+'。');qi++;tmr=setTimeout(q1,1700)}

var r2,found,rd;
function L2(){lv=2;qi=0;items=sh(KEYS).slice(0,3);q2()}
function q2(){if(qi>=3)return L3();var k=items[qi],s=S[k];found=0;
var good=sh(P2.filter(function(c){return c.s===k})).slice(0,3),bad=sh(P2.filter(function(c){return c.s!==k})).slice(0,5);
r2=sh(good.concat(bad));
$.innerHTML=hd(qi,3)+'<div class="card"><h2>เรียงแถวฤดูกาล 排队</h2><p class="mu">แตะการ์ดทั้ง 3 ใบที่เข้ากับฤดูนี้ แล้วอ่านออกเสียง</p><div class="big zh">现在是'+s.z+'。</div><div class="py">Xiànzài shì '+s.p+'.</div><button class="say" onclick="say(\'现在是'+s.z+'\')">🔊 ฟัง</button><div class="cards">'+r2.map(function(c,i){return '<button class="c" onclick="a2('+i+')"><span class="e">'+c.e+'</span><span class="z zh">'+c.z+'</span><span class="p">'+c.p+'</span></button>'}).join('')+'</div><div class="fb" id="fb"></div></div>';
say('现在是'+s.z)}
function a2(i){var c=r2[i],k=items[qi],b=$.querySelectorAll('.c')[i],fb=document.getElementById('fb');
if(c.s===k){b.classList.add('ok');sc++;found++;say(S[k].z+c.z);fb.style.color='var(--ok)';fb.textContent='ถูก! พูดตาม: '+S[k].z+c.z;
if(found===3){qi++;fb.textContent='ครบแล้ว! 🎉';setTimeout(q2,1400)}}
else{b.classList.add('bad');fb.style.color='var(--no)';fb.textContent='ไม่ใช่ฤดูนี้ ลองใหม่'}}

var stepB;
function L3(){lv=3;qi=0;items=sh(P3);q3()}
function q3(){if(qi>=items.length)return end();var it=items[qi];stepB=false;
var o=sh([{z:it.a[0],p:it.a[1],ok:1},{z:it.w[0][0],p:it.w[0][1]},{z:it.w[1][0],p:it.w[1][1]}]);items[qi].o=o;
$.innerHTML=hd(qi,items.length)+'<div class="card"><h2>ยิงลูกบอลตอบคำถาม 投球问答</h2><div class="big zh">'+it.q+'</div><div class="py">'+it.qp+'</div><button class="say" onclick="say(\''+it.q+'\')">🔊 ฟัง</button><div style="text-align:left" id="ops">'+o.map(function(x,i){return '<button class="opt" onclick="a3('+i+')"><span class="z zh">'+x.z+'</span><span class="p">'+x.p+'</span></button>'}).join('')+'</div><div class="fb" id="fb"></div></div>';
say(it.q)}
function a3(i){var it=items[qi],x=it.o[i],bs=$.querySelectorAll('.opt'),fb=document.getElementById('fb');
bs.forEach(function(b,j){b.disabled=true;if(it.o[j].ok)b.classList.add('ok')});
if(!x.ok){bs[i].classList.add('bad');fb.style.color='var(--no)';fb.textContent='ยังไม่ใช่ คำตอบที่ถูกคือ '+it.a[0];say(it.a[0]);qi++;setTimeout(q3,2200);return}
sc++;say(x.z);fb.style.color='var(--ok)';fb.textContent='ตอบถูก! พูดตามแล้วยิงลูกบอลเลย 🏀';
setTimeout(function(){basket(it)},1100)}
function basket(it){$.querySelector('.card').innerHTML='<h2>ยิงลูกบอลเข้าตะกร้า</h2><p class="mu">ประโยคนี้เกี่ยวกับฤดูไหน?</p><div class="big zh">'+it.a[0]+'</div><div class="py">'+it.a[1]+'</div><div class="grid">'+KEYS.map(function(k){var s=S[k];return '<div class="bk"><span class="ball">🏀</span><button class="s '+s.k+'" style="width:100%" data-k="'+k+'" onclick="b3(\''+k+'\',this)"><span>🧺</span><span class="zh">'+s.z+'</span><small>'+s.p+'</small></button></div>'}).join('')+'</div><div class="fb" id="fb"></div>'}
function b3(k,el){var it=items[qi],fb=document.getElementById('fb');
$.querySelectorAll('.s').forEach(function(b){b.disabled=true});
if(k===it.s){sc++;el.parentNode.classList.add('go');fb.style.color='var(--ok)';fb.textContent='เข้าตะกร้า! 🎯 +1';say(S[k].z)}
else{fb.style.color='var(--no)';fb.textContent='พลาด ตะกร้าที่ถูกคือ '+S[it.s].z}
qi++;setTimeout(q3,1700)}

function end(){lv=3;var max=16+9+10,pc=sc/max,st=pc>.85?'⭐⭐⭐':pc>.6?'⭐⭐':'⭐';
$.innerHTML='<div class="card"><h2>จบเกมแล้ว!</h2><div class="stars">'+st+'</div><div class="big">'+sc+' / '+max+' คะแนน</div><p class="mu">'+(pc>.85?'เยี่ยมมาก! 太棒了！':pc>.6?'ดีมาก! 很好！':'สู้ๆ ลองเล่นอีกรอบนะ 加油！')+'</p><p class="mu" style="font-size:.9rem">ประโยคที่ควรจำ: 夏天很热。冬天很冷。我喜欢春天。</p><button class="btn" onclick="L1()">เล่นอีกครั้ง</button><button class="btn alt" onclick="home()">หน้าแรก</button></div>'}
home();
</script>
</body>
</html>
